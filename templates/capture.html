{% extends "base.html" %}
{% block content %}
<div class="data-card">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h3 class="mb-1">Capture face</h3>
      <p class="text-muted mb-0">Student ID {{ sid }}</p>
    </div>
    <a class="btn btn-modern secondary" href="{{ url_for('students') }}">Back to students</a>
  </div>
  <div class="video-wrapper mb-3">
    <video id="capture-video" autoplay playsinline></video>
  </div>
  <div class="d-flex gap-3">
    <button id="capture-btn" class="btn btn-modern primary">Capture & save</button>
    <div id="capture-status" class="text-muted flex-grow-1">Align the student in frame and click capture.</div>
  </div>
</div>
{% endblock %}
