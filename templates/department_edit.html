{% extends "base.html" %}
{% block content %}
<div class="data-card">
  <h3 class="mb-4">Edit department</h3>
  <form method="post" class="row g-4">
    <div class="col-md-4">
      <label class="form-label">Code</label>
      <input class="form-control" name="code" value="{{ department.code }}" required>
    </div>
    <div class="col-md-8">
      <label class="form-label">Name</label>
      <input class="form-control" name="name" value="{{ department.name }}" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Chair name</label>
      <input class="form-control" name="chair_name" value="{{ department.chair_name }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Contact email</label>
      <input type="email" class="form-control" name="contact_email" value="{{ department.contact_email }}">
    </div>
    <div class="col-12">
      <button class="btn btn-modern primary">Update department</button>
    </div>
  </form>
</div>
{% endblock %}
