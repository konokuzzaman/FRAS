{% extends "base.html" %}
{% block content %}
<div class="data-card">
  <h3 class="mb-4">Onboard faculty</h3>
  <form method="post" enctype="multipart/form-data" class="row g-4">
    <div class="col-md-4">
      <label class="form-label">Faculty code</label>
      <input class="form-control" name="faculty_code" required placeholder="FAC001">
    </div>
    <div class="col-md-8">
      <label class="form-label">Full name</label>
      <input class="form-control" name="full_name" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" required>
    </div>
    <div class="col-md-6">
      <label class="form-label">Phone</label>
      <input class="form-control" name="phone">
    </div>
    <div class="col-md-6">
      <label class="form-label">Department</label>
      <select name="department_id" class="form-select">
        <option value="">Assign department</option>
        {% for dept in departments %}
          <option value="{{ dept.department_id }}">{{ dept.code }} · {{ dept.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Temporary password</label>
      <input type="text" class="form-control" name="password" required value="Welcome123">
    </div>
    <div class="col-12">
      <label class="form-label">Avatar (optional)</label>
      <input type="file" name="avatar" accept="image/*" class="form-control">
    </div>
    <div class="col-12">
      <button class="btn btn-modern primary">Create faculty account</button>
    </div>
  </form>
</div>
{% endblock %}
